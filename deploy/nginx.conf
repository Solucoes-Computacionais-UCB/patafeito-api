# /etc/nginx/sites-available/patafeito-api
# Troque api.seudominio.com.br pelo seu domínio. O certbot adiciona o bloco HTTPS:
#   sudo certbot --nginx -d api.seudominio.com.br

server {
    listen 80;
    listen [::]:80;
    server_name api.seudominio.com.br;

    # Mesmo limite do express.json, com folga para cabeçalhos.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Substitui (não concatena) o cabeçalho: o cliente não consegue forjar o IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Métricas só da própria VPS (ex.: curl local), mesmo com METRICS_TOKEN.
    location = /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
    }
}
