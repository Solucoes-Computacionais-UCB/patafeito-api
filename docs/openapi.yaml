openapi: 3.1.0
info:
  title: Patafeito API
  version: 1.0.0
  description: API REST do Patafeito; todos os caminhos usam o prefixo `/api/v1`.
servers:
  - url: http://localhost:3000/api/v1
paths:
  /auth/register:
    post:
      summary: Cria uma conta e uma sessão
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses: { '201': { description: Conta criada } }
  /auth/login:
    post: { summary: Autentica uma conta, responses: { '200': { description: Sessão criada } } }
  /auth/refresh:
    post: { summary: Rotaciona o refresh token, responses: { '200': { description: Nova dupla de tokens } } }
  /auth/logout:
    post: { summary: Revoga o refresh token fornecido, responses: { '204': { description: Sessão encerrada } } }
  /pets/me:
    get: { summary: Retorna o pet autenticado, security: [{ bearerAuth: [] }], responses: { '200': { description: Pet } } }
    post: { summary: Cria o pet inicial, security: [{ bearerAuth: [] }], responses: { '201': { description: Pet criado } } }
  /tasks:
    get: { summary: Lista tarefas, security: [{ bearerAuth: [] }], responses: { '200': { description: Tarefas } } }
    post: { summary: Cria tarefa, security: [{ bearerAuth: [] }], responses: { '201': { description: Tarefa criada } } }
  /tasks/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { summary: Obtém tarefa, security: [{ bearerAuth: [] }], responses: { '200': { description: Tarefa } } }
    patch: { summary: Atualiza tarefa pendente, security: [{ bearerAuth: [] }], responses: { '200': { description: Tarefa atualizada } } }
    delete: { summary: Exclui tarefa, security: [{ bearerAuth: [] }], responses: { '204': { description: Tarefa excluída } } }
  /tasks/{id}/reschedule:
    post: { summary: Reagenda tarefa pendente, security: [{ bearerAuth: [] }], responses: { '200': { description: Tarefa reagendada } } }
  /tasks/{id}/complete:
    post:
      summary: Conclui tarefa e concede XP atomicamente
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { completedAt: { type: string, format: date-time } } }
      responses:
        '200': { description: Reenvios com a mesma chave retornam a mesma resposta }
        '409': { description: Tarefa não pendente ou chave reutilizada }
  /focus-sessions:
    post:
      summary: Inicia uma sessão Pomodoro de 25 minutos
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Sessão iniciada } }
  /focus-sessions/{id}/finish:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      summary: Finaliza uma sessão Pomodoro integral e concede XP
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Sessão concluída e recompensa concedida }
        '409': { description: Sessão incompleta, finalizada ou chave reutilizada }
  /shop/items:
    get:
      summary: Lista os itens ativos da loja
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Catálogo de itens } }
  /shop/purchases:
    post:
      summary: Compra um item usando moedas
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [itemId], properties: { itemId: { type: string, format: uuid } } }
      responses:
        '201': { description: Compra concluída }
        '409': { description: Saldo insuficiente, item já adquirido ou chave reutilizada }
  /inventory:
    get:
      summary: Lista os itens adquiridos pelo usuário
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Inventário } }
    patch:
      summary: Equipa um item do inventário
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [itemId], properties: { itemId: { type: string, format: uuid } } }
      responses: { '200': { description: Item equipado } }
  /notifications:
    get:
      summary: Lista as notificações do usuário autenticado
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Notificações } }
  /notifications/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      summary: Marca uma notificação como lida ou não lida
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [read], properties: { read: { type: boolean } } }
      responses: { '200': { description: Estado atualizado } }
  /sync/push:
    post:
      summary: Aplica um lote idempotente de alterações offline
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operations]
              properties:
                operations:
                  type: array
                  maxItems: 50
      responses:
        '200': { description: Resultado individual por operação: task.create, task.update, task.delete, notification.read e inventory.equip; applied, duplicate, conflict ou rejected }
  /sync/pull:
    get:
      summary: Obtém o snapshot inicial ou alterações posteriores ao cursor
      security: [{ bearerAuth: [] }]
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses: { '200': { description: Mudanças, próximo cursor e hasMore para paginação } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    RegisterInput:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        displayName: { type: string, minLength: 2, maxLength: 80 }
